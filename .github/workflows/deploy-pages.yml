# Publica la web estática (carpeta web/) en GitHub Pages en cada push a main.
# Activar una vez en el repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Regenera app.bundle.js desde los módulos de web/js (única fuente de verdad)
      - name: Empaquetar
        run: node tools/bundle.mjs
        working-directory: web

      # Cache-busting solo en el despliegue: estampa un hash del bundle en el
      # index.html publicado, para que los navegadores recojan el bundle nuevo.
      # El index.html del repo se queda limpio (app.bundle.js sin ?v=), así el
      # doble clic con file:// sigue funcionando.
      - name: Versionar bundle en index.html
        run: |
          HASH=$(sha1sum web/app.bundle.js | cut -c1-8)
          sed -i "s#src=\"app.bundle.js\"#src=\"app.bundle.js?v=$HASH\"#" web/index.html
          echo "Estampado app.bundle.js?v=$HASH"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
